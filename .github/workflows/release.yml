name: Release
# Publishes a GitHub release whenever the version in Sources/BaristaCore/Version.swift
# changes on main. Bump the version, push, and this builds and ships it.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/.*static let current = "\(.*\)".*/\1/p' Sources/BaristaCore/Version.swift)"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "Bad version: '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: |
          swift build
          swift run BaristaChecks
          python3 Tests/agent_integration.py
      - name: Build universal app
        if: steps.version.outputs.publish == 'true'
        run: zsh scripts/build-app.sh --universal
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          zip="Barista-$version.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Barista.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          cat > notes.md <<NOTES
          Download **$zip**, unzip it, and drag **Barista** to Applications.

          This build isn't notarized yet. The first time you open it, macOS will block it: go to
          **System Settings → Privacy & Security** and click **Open Anyway**.

          Works on Apple Silicon and Intel Macs running macOS 13 or later.
          NOTES
          gh release create "v$version" "$zip" "$zip.sha256" --target "$GITHUB_SHA" \
            --title "Barista $version" --notes-file notes.md --generate-notes
