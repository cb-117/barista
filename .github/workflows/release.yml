name: Release
# Publishes a GitHub release whenever the version in Sources/BaristaCore/Version.swift
# changes on main. Bump the version, push, and this builds and ships it: the Mac app, plus
# the Windows and Linux builds from rust/ (which read the same version).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/.*static let current = "\(.*\)".*/\1/p' Sources/BaristaCore/Version.swift)"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "Bad version: '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  portable:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          # Built on 22.04 so the binaries run on older glibc distributions too.
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Test
        working-directory: rust
        run: |
          cargo test --workspace
          cargo build --workspace
      - name: Integration
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python Tests/agent_integration.py --bin-dir rust/target/debug --service rust/target/debug/barista-app
          fi
          python Tests/portable_smoke.py --bin-dir rust/target/debug
          python Tests/usage_check.py --bin-dir rust/target/debug
      - name: Build and package
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          name="barista-$version-${{ matrix.platform }}"
          (cd rust && cargo build --workspace --release)
          mkdir -p "dist/$name"
          cp LICENSE "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp rust/target/release/barista.exe rust/target/release/barista-app.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null && cp "$name.zip" "barista-${{ matrix.platform }}.zip")
          else
            cp rust/target/release/barista rust/target/release/barista-app rust/barista-app/assets/barista.png "dist/$name/"
            (cd dist && tar -czf "$name.tar.gz" "$name" && cp "$name.tar.gz" "barista-${{ matrix.platform }}.tar.gz")
          fi
          rm -rf "dist/$name"
          ls -l dist
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.version.outputs.version }}'
          $setup = installer\windows\build-installer.ps1 -Version $version -SourceDir rust\target\release -OutputDir dist | Select-Object -Last 1
          # Stable name, so install.ps1 can always fetch the latest.
          Copy-Item $setup 'dist\Barista-Setup.exe'
          Get-ChildItem dist
      # Before the artifact is uploaded, so a broken Setup never reaches the release.
      - name: Windows installer smoke test (install, upgrade, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: installer\windows\test-installer.ps1 -Setup "dist\Barista-Setup-${{ needs.version.outputs.version }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: dist/*
          retention-days: 7

  release:
    needs: [version, portable]
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Changelog entry
        run: zsh scripts/release-notes.sh > changes.md
      - name: Test
        run: |
          swift build
          swift run BaristaChecks
          python3 Tests/agent_integration.py
          python3 Tests/usage_check.py --bin-dir .build/debug
      # Mac releases are signed with Developer ID and notarized; a release without the secrets fails.
      - name: Signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [ -n "${!name}" ] || { echo "The $name secret is missing; refusing to ship an unsigned Mac build."; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          [ -n "$identity" ] || { echo "MACOS_CERT_P12 has no Developer ID Application identity."; exit 1; }
          echo "Signing as $identity"
          echo "BARISTA_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build universal app
        run: zsh scripts/build-app.sh --universal
      - name: Notarize app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          zsh scripts/notarize.sh build/Barista.app
          # Fails unless Gatekeeper accepts it as notarized Developer ID software.
          spctl --assess --type execute --verbose=2 build/Barista.app
      - name: Windows and Linux builds
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: portable
          merge-multiple: true
      - name: Package, sign, and publish
        env:
          BARISTA_UPDATE_KEY: ${{ secrets.BARISTA_UPDATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          [ -n "$BARISTA_UPDATE_KEY" ] || { echo "The BARISTA_UPDATE_KEY secret is missing; refusing to ship an unsigned update."; exit 1; }
          zip="Barista-$version.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Barista.app "$zip"

          # Sign the update archive, and make sure it's the key the app trusts.
          signed="$(swift scripts/update-signing.swift sign "$zip")"
          echo "$signed"
          trusted="$(sed -n 's/.*static let publicKey = "\(.*\)".*/\1/p' Sources/BaristaCore/UpdateCheck.swift)"
          [[ "$signed" == *"public key $trusted" ]] || { echo "Signing key doesn't match UpdateSignature.publicKey"; exit 1; }

          # Disk image for first-time installs: drag Barista into Applications.
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild==1.6.5
          DMGBUILD_PYTHON="$RUNNER_TEMP/dmg/bin/python" zsh scripts/make-dmg.sh
          dmg="Barista-$version.dmg"
          zsh scripts/notarize.sh "build/$dmg"
          mv "build/$dmg" "$dmg"
          cp "$dmg" Barista.dmg   # stable names, so the website and install.sh can fetch the latest
          cp "$zip" Barista.zip
          portable=(portable/*)
          # 2 per Linux architecture (versioned + stable tarball) and 4 for Windows (zip and installer, each versioned + stable).
          [ "${#portable[@]}" -eq 8 ] || { echo "Expected 8 Windows/Linux packages, found: ${portable[*]}"; exit 1; }
          mv portable/* .
          portable=("${portable[@]#portable/}")
          shasum -a 256 "$dmg" "$zip" Barista.dmg Barista.zip "${portable[@]}" > SHA256SUMS.txt

          cp changes.md notes.md
          cat >> notes.md <<NOTES

          ---

          **New install (Mac):** download **$dmg**, open it, and drag **Barista** into Applications.

          **Or from Terminal (or let your AI agent do it):** \`curl -fsSL https://baristatime.app/install.sh | sh\`

          **Already have Barista?** It will offer this update in its panel. Click **Update** and it installs and relaunches.

          Works on Apple Silicon and Intel Macs running macOS 13 or later.

          **Windows:** download and run **Barista-Setup-$version.exe** (installs for you, or for all users with administrator rights; adds Barista to startup and your PATH). Or in PowerShell: \`irm https://baristatime.app/install.ps1 | iex\`. A portable **barista-$version-windows-x86_64.zip** is also available.

          **Linux:** the same \`install.sh\` command, or download **barista-$version-linux-x86_64.tar.gz** (or \`-arm64\`). The tray icon uses StatusNotifierItem, built into KDE Plasma, Ubuntu, Xfce, and most desktops; on stock GNOME, install the AppIndicator extension. No GTK libraries are needed.
          NOTES
          gh release create "v$version" "$dmg" Barista.dmg "$zip" "$zip.sig" Barista.zip "${portable[@]}" SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "Barista $version" --notes-file notes.md
