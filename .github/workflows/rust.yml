name: Windows and Linux
# Builds and tests the Rust version of Barista (rust/) on Linux and Windows.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Unit tests
        working-directory: rust
        run: cargo test --workspace
      - name: Build
        working-directory: rust
        run: cargo build --workspace
      - name: CLI, MCP, and hook integration (same suite as the Mac app)
        if: runner.os == 'Linux'
        run: python Tests/agent_integration.py --bin-dir rust/target/debug --service rust/target/debug/barista-app
      - name: Portable smoke test
        run: python Tests/portable_smoke.py --bin-dir rust/target/debug
      - name: Usage tracking and Cursor hooks (same checks as the Mac app)
        run: python Tests/usage_check.py --bin-dir rust/target/debug
      - name: Lint
        working-directory: rust
        run: cargo clippy --workspace --all-targets
      - name: Release build
        working-directory: rust
        run: cargo build --workspace --release
      - name: Windows installer (build)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Sources/BaristaCore/Version.swift -Pattern 'static let current = "(.+)"').Matches[0].Groups[1].Value
          installer\windows\build-installer.ps1 -Version $version -SourceDir rust\target\release -OutputDir installer-out
      - name: Windows installer smoke test (install, upgrade, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: installer\windows\test-installer.ps1 -Setup (Get-ChildItem installer-out\Barista-Setup-*.exe | Select-Object -First 1).FullName
      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: barista-installer-${{ github.sha }}
          path: installer-out/Barista-Setup-*.exe
          retention-days: 30
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: barista-${{ runner.os }}-${{ github.sha }}
          path: |
            rust/target/release/barista
            rust/target/release/barista-app
            rust/target/release/barista.exe
            rust/target/release/barista-app.exe
          retention-days: 30
