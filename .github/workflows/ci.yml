name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Changelog entry for this version
        run: zsh scripts/release-notes.sh > /dev/null
      - name: Build
        run: swift build
      - name: Session checks
        run: swift run BaristaChecks
      - name: CLI, MCP, and hook integration
        run: python3 Tests/agent_integration.py
      - name: Usage tracking and Cursor hooks
        run: python3 Tests/usage_check.py --bin-dir .build/debug
      - name: Website worker (active-user count)
        run: node Tests/worker_check.mjs
      - name: App bundle
        run: zsh scripts/build-app.sh --universal
      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent build/Barista.app Barista.zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Barista-${{ github.sha }}
          path: Barista.zip
          retention-days: 30
