[package]
name = "barista-app"
description = "Barista's tray app: keeps your computer awake while timers, commands, and AI agents work."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

build = "build.rs"

[[bin]]
name = "barista-app"
path = "src/main.rs"

[build-dependencies]
# Windows only (build.rs checks): the cup icon and version details in barista-app.exe.
winresource = "0.1"

[dependencies]
barista = { path = "../barista" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
png = "0.18"
notify-rust = "4"
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Linux: the tray is a StatusNotifierItem served over D-Bus with ksni, so no GTK, glib, or appindicator.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: tray-icon's native backend (no tao: tray.rs pumps the window messages itself).
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
# The panel: WebView2 (built into Windows 11 and current Windows 10) through its COM API directly.
# Not wry: wry's Linux backend would put GTK and glib back into Cargo.lock.
webview2-com = "0.39"
# Notifications as Barista (its own app id and cup) with a button; notify-rust's Windows backend
# can't set either. The version notify-rust already uses.
tauri-winrt-notification = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

